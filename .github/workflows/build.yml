name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build a test APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test APK (install this on your phone to try the game)
        uses: actions/upload-artifact@v4
        with:
          name: tile-merge-test-apk
          path: app/build/outputs/apk/debug/*.apk

      # The steps below only run once you've added the signing secrets (see PUBLISHING.md).
      - name: Decode upload keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # Without the secrets this still builds (unsigned) to check the release version compiles.
      - name: Build release bundle for Google Play
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/upload.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release bundle (upload this .aab to Play Console)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: tile-merge-release-aab
          path: app/build/outputs/bundle/release/*.aab
